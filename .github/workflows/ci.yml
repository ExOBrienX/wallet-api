name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests unitarios e integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Los tests de integración usan Testcontainers, que se apoya en el Docker del runner.
      - name: Compilar y ejecutar todos los tests
        run: ./mvnw -B verify

      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-tests
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build --tag wallet-api .
