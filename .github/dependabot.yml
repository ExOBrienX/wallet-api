# Dependabot revisa cada semana si hay versiones nuevas o vulnerabilidades conocidas en las
# dependencias, y abre un pull request con la actualización.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las librerías de Spring se actualizan juntas, en un solo pull request.
      spring:
        patterns:
          - "org.springframework*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
