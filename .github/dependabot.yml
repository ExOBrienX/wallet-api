# Dependabot revisa una vez al mes si hay versiones nuevas de las dependencias, las acciones
# de GitHub y la imagen base de Docker, y abre un pull request con la actualización.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Las librerías de Spring se actualizan juntas, en un solo pull request.
      spring:
        patterns:
          - "org.springframework*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
